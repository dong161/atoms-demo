<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atoms Demo 应用</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      body {
        overflow: hidden;
      }
      .frame-wrap {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="share-bar">
      <span id="bar-title">加载中…</span>
      <span class="share-actions">
        <a id="bar-edit" href="/" hidden>← 返回编辑</a>
        <button class="btn sm" id="bar-download" hidden title="导出为可独立运行的 HTML 文件">⤓ 导出 HTML</button>
        <a href="/" target="_blank" rel="noopener" id="bar-make">◎ 用 Atoms Demo 做一个</a>
      </span>
    </div>
    <div class="share-main">
      <div class="frame-wrap" id="frame">
        <div class="placeholder"><span class="spinner"></span></div>
      </div>
    </div>
    <script type="module">
      import { exportHtml, mountPreview, saveHtmlFile } from '/js/sandbox.js';
      const frame = document.getElementById('frame');
      const fail = (msg) => {
        frame.innerHTML = `<div class="placeholder"><div class="big">🔗</div><h3>打不开这个应用</h3><p>${msg}</p></div>`;
        document.getElementById('bar-title').textContent = 'Atoms Demo';
      };
      const read = (k) => {
        try {
          return JSON.parse(localStorage.getItem(k));
        } catch {
          return null;
        }
      };
      async function json(url, opts = {}) {
        const res = await fetch(url, opts);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `请求失败（${res.status}）`);
        return data;
      }
      async function main() {
        const slug = location.pathname.match(/^\/s\/([\w-]+)/)?.[1];
        let html, title, kv;
        if (slug) {
          // 公开分享：每个访客一份独立数据（访客 ID 存在本浏览器）
          let visitor = read('atoms.visitor');
          if (!visitor) {
            visitor = crypto.randomUUID().replace(/-/g, '');
            try {
              localStorage.setItem('atoms.visitor', JSON.stringify(visitor));
            } catch {
              /* 隐私模式下仅本次有效 */
            }
          }
          const d = await json(`/api/share/${slug}`);
          html = d.html;
          title = d.title;
          const base = `/api/share/${slug}/kv?visitor=${visitor}`;
          kv = {
            load: async () => (await json(base)).data,
            save: (body) => json(base, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }),
          };
        } else {
          // 项目所有者在新标签页里打开预览
          const q = new URLSearchParams(location.search);
          const token = read('atoms.token');
          if (!token) return fail('请先在 Atoms Demo 中登录。');
          const auth = { Authorization: `Bearer ${token}` };
          const d = await json(`/api/versions/${encodeURIComponent(q.get('version'))}/html`, { headers: auth });
          html = d.html;
          title = `${d.title} · Version ${d.seq}`;
          const edit = document.getElementById('bar-edit');
          edit.href = `/#/p/${encodeURIComponent(d.projectId)}`;
          edit.hidden = false;
          document.getElementById('bar-make').hidden = true;
          // 数据归属以服务端返回的版本所属项目为准，忽略 URL 里的 project 参数，防止版本与数据错配
          const base = `/api/projects/${encodeURIComponent(d.projectId)}/kv`;
          kv = {
            load: async () => (await json(base, { headers: auth })).data,
            save: (body) =>
              json(base, { method: 'POST', headers: { ...auth, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }),
          };
        }
        document.title = title;
        document.getElementById('bar-title').textContent = title;
        await mountPreview(frame, html, { kv });
        const dl = document.getElementById('bar-download');
        dl.hidden = false;
        dl.onclick = async () => {
          // 导出时带上当前看到的数据：所有者是项目数据，分享页访客是自己的那份
          const data = await kv.load().catch(() => ({}));
          saveHtmlFile(title.replace(/\s*·\s*/g, '-'), exportHtml(html, data || {}));
        };
      }
      main().catch((e) => fail(e.message));
    </script>
  </body>
</html>
