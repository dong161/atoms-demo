# 尽力减少 Render 免费实例15分钟无流量休眠；GitHub schedule可能延迟，不保证无冷启动。
name: keepalive
on:
  schedule:
    # UTC分钟3、8、13…58，每5分钟；避开整点高峰。
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keepalive.yml'
      - 'scripts/keepalive.mjs'
permissions:
  contents: read
concurrency:
  group: render-keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wake service and verify JSON health
        run: node scripts/keepalive.mjs
